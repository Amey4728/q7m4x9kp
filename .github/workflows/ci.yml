name: CI
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests (unit, property-based, API) with coverage gate
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=90

  contract:
    # The front end's TypeScript types are generated from the backend's OpenAPI spec.
    # Fail if someone changed the API without regenerating them (or vice versa).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r backend/requirements.txt
      - run: python backend/scripts/export_openapi.py
      - run: cd frontend && npm run gen:api
      - run: git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test the compose stack
        run: |
          docker compose up --build -d --wait
          curl -fsS http://localhost:8080/api/health
          curl -fsS "http://localhost:8080/api/v1/decision?decision_date=2026-01-15" | grep -q '"delivery_day":"2026-01-16"'
          docker compose down
